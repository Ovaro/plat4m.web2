  <div class="row">
    <div class="col-sm">
      <div class="row">
        <div class="col"></div>
        <div class="col col-auto">
          <div class="float-right" style="display: flex; padding-top: 5px">
            <p-selectButton
              styleClass="period-selector"
              [options]="periods"
              [(ngModel)]="selectedPeriod"
              emptyMessage="All"
              optionLabel="name"
              (onChange)="onChangePeriod($event)"
            >
            </p-selectButton>
          </div>
        </div>
      </div>
    </div>
  </div>

  <jhi-history-chart-dialog #historyChartDialog></jhi-history-chart-dialog>
  <jhi-dashboard-panel-config-dialog
    #panelConfigDialog
    [resources]="allResources"
    (savePanel)="savePanelDefinition($event)"
  ></jhi-dashboard-panel-config-dialog>

  <div *ngIf="dashboardConfigWarning" class="dashboard-config-warning" role="alert">
    {{ dashboardConfigWarning }}
  </div>

  <div #dashboardGridFrame class="dashboard-grid-frame">
    <gridstack #gridstack [options]="options" class="dashboard-gridstack" (changeCB)="onGridChange($event)">
      <gridstack-item *ngFor="let item of dashboard" [options]="item">
        <jhi-dashboard-panel-host
          [widget]="item"
          [resizeEvent]="resizeEvent"
          (panelClick)="onClick($event)"
          (configureClick)="configurePanel($event)"
        ></jhi-dashboard-panel-host>
      </gridstack-item>
    </gridstack>
  </div>
